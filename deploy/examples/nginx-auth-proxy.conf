# Example: Mobile Tmux behind nginx with your own sign-in (MOBILE_TMUX_AUTH=proxy).
# Put these locations inside an HTTPS server block that already requires login (auth_request, basic auth, SSO...).
# Set MOBILE_TMUX_AUTH=proxy for the server: it then refuses to listen on anything but loopback.

location = /mobile { return 301 /mobile/; }

location ^~ /mobile/ {
    proxy_pass http://127.0.0.1:7683;
    proxy_set_header Host $http_host;   # keep the port: the Origin check compares it
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;   # replaces anything the client sent; needed for MOBILE_TMUX_TRUST_FORWARDED=1
    proxy_buffering off;          # keeps the live chat stream (server-sent events) flowing
    proxy_read_timeout 600;
}

# Optional full interactive terminal (ttyd). Needs WebSocket upgrades.
location ^~ /terminal/live/ {
    proxy_pass http://127.0.0.1:7683;   # the server passes this on to ttyd (it checks its own sign-in in token mode)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;   # define with: map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    proxy_set_header Host $http_host;   # keep the port: the Origin check compares it
    proxy_buffering off;
    proxy_read_timeout 86400;
}
