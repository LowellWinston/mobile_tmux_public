<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mobile Terminal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#10151e;color:#e9edf5;font:16px system-ui,-apple-system,sans-serif}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;gap:6px;padding:5px max(6px,env(safe-area-inset-left));border-bottom:1px solid #334155;background:#111827}h1.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#session-tabs{display:flex;align-items:center;flex:1;min-width:0;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}#session-tabs::-webkit-scrollbar{display:none}.session-tab{flex:0 0 auto;max-width:38vw;min-height:40px;padding:6px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid #415674;border-radius:8px;background:#1c2636;color:#d6e2f3;font:inherit;font-size:.85rem}.session-tab[aria-selected=true]{background:#b4d3ff;color:#10203a;border-color:#b4d3ff}.control{min-height:42px;padding:7px 12px;border:1px solid #415674;border-radius:9px;background:#1c2636;color:#e9edf5;font:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.control.primary{background:#b4d3ff;color:#10203a;border-color:#b4d3ff;font-weight:650}#open-sessions{flex:0 0 42px;width:42px;padding:4px;font-size:1.4rem;line-height:1}#screen{flex:1;min-height:0;background:#000}iframe{display:block;width:100%;height:100%;border:0;background:#000}#empty{padding:24px;color:#bdcadb;text-align:center}#status{min-height:25px;margin:0;padding:4px 10px;color:#bac8da;font-size:.72rem;background:#111827;border-top:1px solid #27364b}.veil{position:fixed;inset:0;z-index:5;background:#000a;display:flex;align-items:flex-end}.veil[hidden]{display:none}dialog{position:static;inset:auto;margin:0;width:100%;max-width:none;max-height:65dvh;overflow:auto;background:#172130;color:#e9edf5;border:1px solid #526782;border-bottom:0;border-radius:18px 18px 0 0;padding:14px 14px max(16px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px #0008}dialog h2{font-size:1rem;margin:0 0 10px}#session-list{display:grid;gap:8px;max-height:40dvh;overflow:auto}.session{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #354962;border-radius:10px;background:#1c2636}.session-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.session-meta{font-size:.7rem;color:#a9bad0}.session button{min-height:40px;padding:6px 10px;font-size:.82rem}.danger{border-color:#80504c;color:#ffd0c7}.empty-list{padding:10px;color:#a9bad0;font-size:.85rem}#create-form{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #354962}#new-name{flex:1;min-width:0;min-height:44px;padding:8px 10px;border:1px solid #526782;border-radius:9px;background:#10151e;color:#fff;font:inherit}#manager-error{min-height:1.2em;margin:8px 0 0;color:#f2b899;font-size:.78rem}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #facc15;outline-offset:2px}@media(min-width:760px){body{max-width:1100px;margin:auto;border-left:1px solid #27364b;border-right:1px solid #27364b}header{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header><h1 class="sr-only">Tmux sessions</h1><nav id="session-tabs" role="tablist" aria-label="Active tmux sessions"></nav><button id="open-sessions" class="control" type="button" role="tab" aria-label="Choose or start a tmux session" title="Choose or start a tmux session">+</button><a class="control" href="/mobile/">Chat</a></header>
<main id="screen" role="tabpanel" aria-label="Active terminal"><p id="empty">Loading tmux sessions…</p></main>
<p id="status" role="status">Connecting…</p>
<div id="manager" class="veil" hidden><dialog open aria-labelledby="manager-title"><h2 id="manager-title">Tmux sessions</h2><div id="session-list"></div><form id="create-form"><input id="new-name" name="name" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_-]*" placeholder="New session name" autocomplete="off" required><button id="create-button" class="control primary" type="submit">New</button><button id="close-manager" class="control" type="button">Done</button></form><p id="manager-error" role="status"></p></dialog></div>
<script src="/mobile/termius.js"></script>
</body>
</html>
